#
# site-runner.test.yml
# This workflow allows you to test your server config in a container.
# Use it for testing out changes to your Ansible inventory or Roles. 
#
name: Test server config
on:
  pull_request:

env: 
  # This example creates github runners for each subsequent job.
  # To do so, it needs a GitHub token with admin:write permissions.
  # Create a personal access token with admin:write permissions on the repository you wish to deploy.
  RUNNER_GITHUB_TOKEN: "${{ secrets.OUR_GITHUB_TOKEN_RUNNER_ADMIN }}"

  # The playbook to run.
  # You can use the one included in the site-runn ansible roles or make your own.
  # ANSIBLE_PLAYBOOK: ansible/site-runner/playbook.yml
  ANSIBLE_PLAYBOOK: ansible/playbook.example.yml
  RUNNER_NAME: platform@server.mysite.com

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  configure-server:
    name: Run Playbook
    runs-on: ubuntu-latest

    steps:
      - uses: jonpugh/goatscripts@v1
      - name: Install docker-compose
        uses: KengoTODA/actions-setup-docker-compose@v1
        with:
          version: '2.24.0'

      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Start Container
        run: |
          docker compose up -d --quiet-pull
          docker-compose exec operations chmod 0400 /etc/shadow

      - name: Inventory
        run: docker compose exec operations ansible-playbook ${ANSIBLE_PLAYBOOK} --list-hosts
        env: 
          SUCCESS: "Ansible inventory"
          
      - name: Playbook
        run: docker compose exec operations ansible-playbook ${ANSIBLE_PLAYBOOK} --extra-vars operations_github_api_token=${RUNNER_GITHUB_TOKEN} --extra-vars vars.ci.yml

      - name: Set known hosts.
        run: |
          echo "operations_known_hosts: \"${{ secrets.SSH_KNOWN_HOSTS }}\"" > vars.ci.yml

      - name: "Wait for all jobs to complete."
        env: 
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}

        run: |
          ./scripts/wait-for-no-jobs
    
  create-site:
    name: Create Preview Site
    uses: operations-project/github-action-ddev-runner/.github/workflows/operations.site.deploy.ddev.yml@feature/reusable-workflows
    with:

      # Where to install your site.
      # By default, the site runner ansible role creates user "platform" at "/var/platform"
      git_root: /var/platform/Sites/${{ github.repository }}/pr${{ github.event.number }}

      # Project name for this instance. Used to generate the domain name.
      ddev_project_name: example.pr${{ github.event.number }}

      # Top-level domain. Sites are hosted as subdomains under this.
      ddev_project_tld: server.mydomain.com

      # Tell the remote workflow what to run on.
      # For site runner, the default is "platform@{hostname -f}"
      # This is defined in the site runner playbook, but can be controlled with variables.
      github_runs_on: platform@server.mydomain.com

      # Define the github environment name, to be displayed in the UI.
      github_environment_name: pr${{ github.event.number }}

      # Define a github environment url, a link to be shown on the pull request.
      github_environment_url: http://example.pr${{ github.event.number }}.server.mydomain.com
      
      # To persist a site's data, set "run_prepare_command" to false.
      run_prepare_command: true

      # Prepare the site's data. Run your sync/import/install script.
      # Change to 'ddev drush site:install' or 'ddev sync' or whatever your project uses to prepare the site data.
      prepare_command: ddev status

      # Command to run after deploying code changes
      # Change to 'ddev drush update:database' or './deploy.sh' or whatever your project uses to after new code is available.
      deploy_command: ddev status

      # Additional ddev config to apply to the environment.
      # Will be saved to .ddev/config.zzz.runner.yaml
      # See your project's .ddev/config.yaml file for examples.
      ddev_config: |
